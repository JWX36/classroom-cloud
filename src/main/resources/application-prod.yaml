# 生产环境：MySQL 8 + Redis + 邮件
# 首次部署请先执行 db/mysql-schema.sql 建表
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/kys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

app:
  cache:
    mode: redis
  mail:
    enabled: true

logging:
  file:
    name: ${LOG_FILE:./logs/kys.log}
  level:
    root: INFO
