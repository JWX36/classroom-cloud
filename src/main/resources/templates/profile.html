<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('个人中心')}"></head>

<body class="app">
<aside class="sidebar" th:replace="~{fragments/layout :: sidebar(${currentUser.role}, 'profile','个人中心')}"></aside>
<div class="main">
  <header class="topbar" th:replace="~{fragments/layout :: topbar('个人中心')}"></header>
  <main class="content">
    <div class="page-head">
      <div>
        <h1 class="page-title">个人中心</h1>
        <p class="page-sub">头像、手机号、邮箱和密码都可以在这里修改</p>
      </div>
    </div>

    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <div class="profile-layout">
      <section class="card card-pad profile-summary">
        <div class="avatar xl" th:if="${user.avatar != null}">
          <img th:src="@{'/' + ${user.avatar}}" alt="avatar">
        </div>
        <div class="avatar xl" th:if="${user.avatar == null}" th:text="${user.initial}">江</div>
        <h2 th:text="${user.name}">01</h2>
        <p class="muted" th:text="${user.code}">20240101</p>
        <span class="badge purple" th:text="${user.roleText}">学生</span>
        <form th:action="@{/logout}" method="post" class="mt-16">
          <button type="submit" class="btn ghost block">
            <svg class="icon"><use href="/img/icons.svg#i-logout"></use></svg>切换账号
          </button>
        </form>
        <div class="aside-list mt-20">
          <div class="aside-line"><span>手机号</span><b th:text="${user.phone}">13800000001</b></div>
          <div class="aside-line"><span>邮箱</span><b th:text="${user.email ?: '未填写'}">未填写</b></div>
          <div class="aside-line" th:if="${student != null}"><span>所在班级</span><b th:text="${clazz != null ? clazz.name : '—'}">班级</b></div>
          <div class="aside-line" th:if="${teacher != null}"><span>任教课程</span><b th:text="${teacher.subject}">网络系统集成与运维</b></div>
        </div>
      </section>

      <div class="profile-forms">
        <section class="card">
          <div class="card-head"><h2><span class="card-title-dot"></span>修改头像</h2></div>
          <div class="card-body avatar-change-body">
            <div class="avatar xl avatar-current" id="avatarThumb" title="点击更换头像" style="cursor:pointer">
              <img th:if="${user.avatar != null}" th:src="@{'/' + ${user.avatar}}" alt="头像">
              <span th:if="${user.avatar == null}" th:text="${user.initial}">?</span>
            </div>
            <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" id="avatarForm" class="avatar-change-form">
              <input type="file" id="avatarInput" name="avatar" accept="image/*" hidden>
              <button type="button" class="btn primary" id="pickAvatar">更换头像</button>
              <p class="muted small" style="margin-top:8px">选择图片后在弹窗中裁剪，点「更新」立即生效</p>
            </form>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2><span class="card-title-dot"></span>修改资料</h2></div>
          <form th:action="@{/profile}" method="post" enctype="multipart/form-data" th:object="${profileForm}">
            <div class="card-body">
              <div class="form-grid">
                <div class="field full">
                  <label for="name">姓名 <span class="req">*</span></label>
                  <input id="name" class="input" th:field="*{name}" placeholder="请输入姓名">
                  <span class="field-hint">默认使用学号末两位，可在此修改；修改后会同步到班级名册</span>
                  <span class="field-hint" th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:#dc2626"></span>
                </div>
                <div class="field">
                  <label for="phone">手机号 <span class="req">*</span></label>
                  <input id="phone" class="input" th:field="*{phone}" placeholder="11 位手机号">
                  <span class="field-hint" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:#dc2626"></span>
                </div>
                <div class="field">
                  <label for="email">邮箱</label>
                  <input id="email" class="input" th:field="*{email}" placeholder="选填，用于接收提醒">
                  <span class="field-hint" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:#dc2626"></span>
                </div>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn primary">保存资料</button>
            </div>
          </form>
        </section>

        <section class="card mt-20">
          <div class="card-head"><h2><span class="card-title-dot"></span>修改密码</h2></div>
          <form th:action="@{/profile/password}" method="post" th:object="${passwordForm}">
            <div class="card-body">
              <div class="form-grid">
                <div class="field full">
                  <label for="oldPassword">原密码</label>
                  <input id="oldPassword" class="input" type="password" th:field="*{oldPassword}">
                </div>
                <div class="field">
                  <label for="newPassword">新密码</label>
                  <input id="newPassword" class="input" type="password" th:field="*{newPassword}" placeholder="至少 6 位">
                </div>
                <div class="field">
                  <label for="confirmPassword">确认新密码</label>
                  <input id="confirmPassword" class="input" type="password" th:field="*{confirmPassword}">
                </div>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn ghost">修改密码</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="modal-mask" id="avatarCropModal">
  <div class="modal avatar-crop-modal">
    <h3>更换头像</h3>
    <div class="crop-body">
      <div class="crop-stage" id="cropStage">
        <canvas id="cropCanvas" width="280" height="280"></canvas>
        <div class="crop-ring"></div>
      </div>
      <div class="crop-side">
        <canvas id="cropPreview" width="120" height="120"></canvas>
        <p class="muted small" style="margin-top:8px">预览头像</p>
      </div>
    </div>
    <label class="crop-zoom">缩放
      <input type="range" id="cropZoom" min="100" max="400" value="100">
    </label>
    <p class="muted small" style="text-align:center">拖动图片调整位置；输出 320×320，支持 JPG/PNG，原图需小于 2M</p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="cropRepick">重新选择</button>
      <button type="button" class="btn primary" id="cropApply">更新</button>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
(function avatarCropInit() {
  var input = document.getElementById('avatarInput');
  var modal = document.getElementById('avatarCropModal');
  var form = document.getElementById('avatarForm');
  if (!input || !modal) return;
  var canvas = document.getElementById('cropCanvas');
  var ctx = canvas.getContext('2d');
  var preview = document.getElementById('cropPreview');
  var pctx = preview.getContext('2d');
  var zoom = document.getElementById('cropZoom');
  var SIZE = canvas.width;
  var img = null, base = 1, scale = 1, ox = 0, oy = 0;

  function draw() {
    ctx.fillStyle = '#14182d';
    ctx.fillRect(0, 0, SIZE, SIZE);
    if (img) ctx.drawImage(img, ox, oy, img.width * scale, img.height * scale);
    pctx.fillStyle = '#14182d';
    pctx.fillRect(0, 0, 120, 120);
    pctx.drawImage(canvas, 0, 0, SIZE, SIZE, 0, 0, 120, 120);
  }
  function clamp() {
    var w = img.width * scale, h = img.height * scale;
    ox = Math.min(0, Math.max(ox, SIZE - w));
    oy = Math.min(0, Math.max(oy, SIZE - h));
  }
  function fit() {
    base = Math.max(SIZE / img.width, SIZE / img.height);
    scale = base;
    ox = -(img.width * scale - SIZE) / 2;
    oy = -(img.height * scale - SIZE) / 2;
    clamp();
    draw();
  }
  function openCrop() {
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { (window.uiToast || alert)('头像图片需小于 2M', 'warn'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function () {
      img = new Image();
      img.onload = function () { fit(); modal.classList.add('open'); };
      img.onerror = function () { (window.uiToast || alert)('图片文件无法读取，请换一张', 'warn'); input.value = ''; };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function closeCrop() { modal.classList.remove('open'); }

  input.addEventListener('change', openCrop);

  var dragging = false, sx = 0, sy = 0;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; sx = e.clientX; sy = e.clientY;
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || !img) return;
    ox += e.clientX - sx; oy += e.clientY - sy;
    sx = e.clientX; sy = e.clientY;
    clamp(); draw();
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  zoom.addEventListener('input', function () {
    if (!img) return;
    var center = SIZE / 2;
    var oldW = img.width * scale;
    scale = base * (parseFloat(zoom.value) / 100);
    var newW = img.width * scale;
    // 以视口中心为锚点缩放
    ox = center - (center - ox) * (newW / oldW);
    oy = center - (center - oy) * (newW / oldW);
    clamp(); draw();
  });

  modal.addEventListener('click', function (e) { if (e.target === modal) closeCrop(); });
  // 「更换头像」按钮 + 点头像图片本身，都打开选择器
  document.getElementById('pickAvatar').addEventListener('click', function () { input.click(); });
  document.getElementById('avatarThumb').addEventListener('click', function () { input.click(); });
  document.getElementById('cropRepick').addEventListener('click', function () {
    input.value = '';
    input.click();
  });
  document.getElementById('cropApply').addEventListener('click', function () {
    if (!img) return;
    var out = document.createElement('canvas');
    out.width = 320; out.height = 320;
    var octx = out.getContext('2d');
    octx.drawImage(canvas, 0, 0, SIZE, SIZE, 0, 0, 320, 320);
    out.toBlob(function (blob) {
      var dt = new DataTransfer();
      dt.items.add(new File([blob], 'avatar.png', { type: 'image/png' }));
      input.files = dt.files;
      closeCrop();
      // 裁剪完成立即上传独立头像表单，保存后刷新页面展示新头像
      form.submit();
    }, 'image/png');
  });
})();
</script>

</html>
